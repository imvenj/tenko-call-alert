<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tenko 点呼アラート</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main>
    <h1>Tenko 点呼アラート</h1>
    <label class="switch-row">
      <span>監視を有効にする</span>
      <input id="enabled" type="checkbox" />
    </label>
    <label class="switch-row setting-row">
      <span>バックグラウンド監視</span>
      <input id="background-polling-enabled" type="checkbox" />
    </label>
    <label class="setting-row" for="repeat-count">
      <span>音声通知の回数</span>
      <select id="repeat-count">
        <option value="1">1 回</option>
        <option value="2">2 回</option>
        <option value="3">3 回</option>
        <option value="4">4 回</option>
        <option value="5">5 回</option>
      </select>
    </label>
    <label class="setting-row" for="speech-rate">
      <span>音声の再生速度</span>
      <select id="speech-rate">
        <option value="0.5">0.5×</option>
        <option value="0.75">0.75×</option>
        <option value="1">1.0×</option>
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option>
        <option value="1.75">1.75×</option>
        <option value="2">2.0×</option>
      </select>
    </label>
    <label class="switch-row setting-row">
      <span>未対応の間は音声通知を続ける</span>
      <input id="continuous-alert-enabled" type="checkbox" />
    </label>
    <label id="continuous-alert-interval-row" class="setting-row" for="continuous-alert-interval">
      <span>繰り返し間隔</span>
      <span class="number-setting">
        <input id="continuous-alert-interval" type="number" min="5" step="1" />
        秒
      </span>
    </label>
    <button id="test" type="button">音声をテスト</button>
    <p id="repeat-hint" class="hint">点呼が入ると、「点呼があります。」と1回読み上げます。</p>
    <label class="switch-row setting-row">
      <span>点呼一覧ページの表示忘れを通知</span>
      <input id="page-reminder-enabled" type="checkbox" />
    </label>
    <label class="setting-row" for="page-reminder-interval">
      <span>表示忘れの通知間隔</span>
      <span class="number-setting">
        <input id="page-reminder-interval" type="number" min="1" max="60" step="1" />
        分
      </span>
    </label>
  </main>
  <script src="popup.js"></script>
</body>
</html>
